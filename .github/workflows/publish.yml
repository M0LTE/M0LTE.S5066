name: publish

# Cuts a release: on a version tag, gate on a green build and test run, then pack the three
# libraries and push them to nuget.org and open a GitHub release. Nothing publishes on an
# ordinary push: only when a v<MAJOR>.<MINOR>.<PATCH> tag is pushed, and only if that tag
# matches <Version> in Directory.Build.props.
#
# Publishing uses nuget.org Trusted Publishing (OIDC): no long-lived API key is stored.
# NuGet/login exchanges a short-lived GitHub OIDC token for a temporary API key, matched
# against the trusted-publishing policy configured on nuget.org for this repo's
# `publish.yml`. The nuget.org username is read from the `NUGET_USER` repo variable.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # The .debs for s5066d, s5066-test and s5066-ip, built on native amd64 and arm64 runners and install-tested
  # on Debian 13. Independent of the NuGet job; attached to the GitHub release by attach-debs below.
  debs:
    uses: ./.github/workflows/deb.yml

  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the OIDC token for Trusted Publishing
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify tag matches <Version>
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props)"
          echo "tag=$tag  <Version>=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match <Version>$version in Directory.Build.props. Bump the version in the same commit as the tag."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack -c Release --no-build -o artifacts

      - name: Check the package set
        run: |
          set -euo pipefail
          ls artifacts
          test "$(ls artifacts/*.nupkg | wc -l)" = 3
          # pdn-soundmodem (AGPL AND GPL-3.0-only) must not reach a package offered commercially too.
          for p in artifacts/*.nupkg; do
            if unzip -p "$p" "*.nuspec" | grep -qiE "pdn-soundmodem|M0LTE\.S5066\.Radio"; then
              echo "$p depends on pdn-soundmodem or M0LTE.S5066.Radio"; exit 1
            fi
          done

      # Get a short-lived nuget.org API key via Trusted Publishing, immediately before push
      # (the key is valid for ~1 hour). NUGET_USER is the nuget.org profile name, not an email.
      - name: NuGet login (OIDC to a temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          set -euo pipefail
          key='${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          dotnet nuget push "artifacts/*.nupkg"  --api-key "$key" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" --api-key "$key" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes

  # Add the .debs to the release the publish job created. They are not pushed to any apt repository.
  attach-debs:
    needs: [publish, debs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: debs-*
          path: debs
          merge-multiple: true

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd debs
          sha256sum *.deb > SHA256SUMS
          ls -l
          gh release upload "$GITHUB_REF_NAME" *.deb SHA256SUMS --clobber
